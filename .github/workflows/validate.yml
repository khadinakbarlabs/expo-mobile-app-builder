name: Validate public package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-release.mjs
      - run: node scripts/audit-public-package.mjs .
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node scripts/build-agency-catalog.mjs --check
      - run: node scripts/validate-agency.mjs
      - run: python3 scripts/package-agency.py

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
